name: Render Mermaid Diagrams
on:
  workflow_call:
    inputs:
      mmd_path:
        description: 'Location of the Mermaid Markdown file'
        required: false
        default: "docs"
        type: string
      svg_path:
        description: 'Location of the path to generate svg files to'
        required: false
        default: "docs/images"
        type: string
      puppeteer_config:
        description: 'Path to puppeteer config file'
        required: false
        default: "docs/puppeteer-config.json"
        type: string
      skip_ci:
        description: 'Whether to append [skip ci] to autogenerated diagram commits'
        required: false
        default: false
        type: boolean

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      # git-auto-commit-action below pushes the rendered diagrams back, so this
      # checkout has to keep its credentials. At this pin they are not written
      # into the checkout: they live in a config file under $RUNNER_TEMP that the
      # repository's .git/config includes.
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1  # zizmor: ignore[artipacked]

      # mermaid-cli is a one-off global tool for this job, so there is no
      # lockfile to install it from.
      - name: Install Mermaid CLI
        run: npm install -g @mermaid-js/mermaid-cli  # zizmor: ignore[adhoc-packages]

      - name: Render Diagrams
        env:
          MMD_PATH: ${{ inputs.mmd_path }}
          SVG_PATH: ${{ inputs.svg_path }}
          PUPPETEER_CONFIG: ${{ inputs.puppeteer_config }}
        run: |
          mkdir -p "${SVG_PATH}"
          shopt -s nullglob
          files=("${MMD_PATH}"/*.mmd)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No .mmd files found in ${MMD_PATH}; skipping."
            exit 0
          fi
          for file in "${files[@]}"; do
            base="$(basename "${file}" .mmd)"
            mmdc -p "${PUPPETEER_CONFIG}" -i "${file}" -o "${SVG_PATH}/${base}.svg" -t neutral
          done

      - name: Prepare Commit Message
        id: commit_message
        run: |
          commit_message="docs: update rendered mermaid diagram"
          if [ "${{ inputs.skip_ci }}" = "true" ]; then
            commit_message="${commit_message} [skip ci]"
          fi
          echo "message=${commit_message}" >> "${GITHUB_OUTPUT}"

      - name: Commit and Push
        uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d # v7.2.0
        with:
          commit_message: ${{ steps.commit_message.outputs.message }}
          file_pattern: '${{ inputs.svg_path }}/*.svg'
