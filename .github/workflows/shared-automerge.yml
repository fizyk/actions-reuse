name: Merge me test dependencies!

on:
  workflow_call:
    secrets:
      client_id:
        description: "Github Application Client ID that'll be used for merging"
        required: true
      private_key:
        description: "Github Application's private key"
        required: true

jobs:
  merge-me:
    name: Merge me!
    # `pull_request_target` is the cheapest trigger: arming is a one-shot
    # action, so there is no reason to run once per finished check. The
    # continuous integration triggers stay supported for callers that have
    # not moved over, and there only a successful run is worth acting on.
    #
    # `pull_request` is deliberately absent: dependabot-triggered
    # `pull_request` runs get a read-only token and no repository secrets,
    # so the app token cannot be minted.
    if: ${{ github.event_name == 'pull_request_target' || github.event.workflow_run.conclusion == 'success' || github.event.check_suite.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Impersonate update bot
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: generate-token
        with:
          client-id: ${{ secrets.client_id }}
          private-key: ${{ secrets.private_key }}
          permission-pull-requests: write
          permission-contents: write
          # Auto-merge merges with the credentials that armed it. When a pull
          # request touching .github/workflows/ is behind its base, the merge
          # commit carries workflow content found in neither parent, and
          # GitHub disarms auto-merge unless the merger can write workflows.
          # Two dependabot github_actions bumps landing together hit this.
          permission-workflows: write
          permission-metadata: read
      # Arms GitHub's native auto-merge on non-major updates; the rules live in
      # the action's automerge.py, where they are tested.
      #
      # Requires `allow_auto_merge` to be enabled on the calling repository.
      - name: Arm auto-merge
        uses: $/.github/actions/automerge
        with:
          github-token: ${{ steps.generate-token.outputs.token }}
          # `pull_request_target` carries a single pull request directly, the
          # continuous integration events carry a list of the pull requests
          # the finished run belonged to.
          pull-requests: ${{ github.event.pull_request.number || toJSON(github.event.workflow_run.pull_requests || github.event.check_suite.pull_requests) }}
