name: Build Python 🐍 distributions 📦 and publish to PyPI

on:
  workflow_call:
    inputs:
      publish:
        description: 'Whether to publish Python 🐍 distributions 📦 to PyPI'
        required: false
        default: false
        type: boolean
      artifact:
        description: 'Whether to store Python 🐍 distributions 📦 as pipeline artifact'
        required: false
        default: false
        type: boolean
      python-version:
        default: "3.15"
        required: false
        type: string
      dependency-manager:
        description: 'Build tool to use (build, uv)'
        default: 'build'
        required: false
        type: string
    secrets:
      pypi_token:
        description: 'Token used to authenticate to the PyPI'
        required: false



jobs:
  build:
    name: Build Python 🐍 distributions 📦
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/python-build
        if: ${{ inputs.dependency-manager != 'uv' }}
        with:
          python-version: ${{ inputs.python-version }}
      - uses: $/.github/actions/uv-build
        if: ${{ inputs.dependency-manager == 'uv' }}
        with:
          python-version: ${{ inputs.python-version }}
      - name: Store distributions 📦 as artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: dist/
      # Trusted publishing has to be configured per project on PyPI and needs an
      # `id-token: write` grant from the caller, so this workflow keeps taking a
      # token: callers that have moved to trusted publishing can call
      # pypa/gh-action-pypi-publish directly instead.
      - name: Publish distribution 📦 to PyPI
        if: ${{ inputs.publish }}
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.2  # zizmor: ignore[use-trusted-publishing]
        with:
          password: ${{ secrets.pypi_token }}
          verbose: true
