name: Scheduled release

on:
  workflow_call:
    inputs:
      dependency-manager:
        description: 'Dependency manager to use (pipenv, uv)'
        default: 'pipenv'
        required: false
        type: string
      newsfragments-required:
        description: 'Only release when at least one towncrier newsfragment is present'
        default: false
        required: false
        type: boolean
      minor-fragments:
        description: 'Comma-separated towncrier types that trigger a minor bump'
        default: 'feature'
        required: false
        type: string
      major-fragments:
        description: 'Comma-separated towncrier types that trigger a major bump. Leave empty on pre-1.0 projects and list the breaking type under minor-fragments instead.'
        default: ''
        required: false
        type: string
    secrets:
      app_id:
        description: "Github Application ID that'll be used for releasing"
        required: true
      private_key:
        description: "Github Application's private key"
        required: true

# Planning only reads the repository; the release is pushed with the app token
# minted in shared-release.yml.
permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.plan.outputs.should_release }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - id: plan
        uses: fizyk/actions-reuse/.github/actions/release-plan@v5.5.0
        with:
          newsfragments-required: ${{ inputs.newsfragments-required }}
          minor-fragments: ${{ inputs.minor-fragments }}
          major-fragments: ${{ inputs.major-fragments }}

  release:
    needs: plan
    if: needs.plan.outputs.should_release == 'true'
    uses: fizyk/actions-reuse/.github/workflows/shared-release.yml@v5.5.0
    with:
      version: ${{ needs.plan.outputs.version }}
      dependency-manager: ${{ inputs.dependency-manager }}
    secrets:
      app_id: ${{ secrets.app_id }}
      private_key: ${{ secrets.private_key }}
