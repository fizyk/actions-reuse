name: Scheduled release

on:
  workflow_call:
    inputs:
      dependency-manager:
        description: 'Dependency manager to use (pipenv, uv)'
        default: 'pipenv'
        required: false
        type: string
      newsfragments-required:
        description: 'Only release when at least one towncrier newsfragment is present'
        default: false
        required: false
        type: boolean
      newsfragments-dir:
        description: "Directory holding towncrier newsfragments (towncrier's 'directory' setting)"
        default: 'newsfragments'
        required: false
        type: string
      newsfragments-extension:
        description: 'Newsfragment file extension, without the leading dot (rst, md)'
        default: 'rst'
        required: false
        type: string
      minor-fragments:
        description: 'Comma-separated towncrier types that trigger a minor bump'
        default: 'feature'
        required: false
        type: string
      major-fragments:
        description: 'Comma-separated towncrier types that trigger a major bump. Leave empty on pre-1.0 projects and list the breaking type under minor-fragments instead.'
        default: ''
        required: false
        type: string
    secrets:
      app_id:
        description: "Github Application ID that'll be used for releasing"
        required: true
      private_key:
        description: "Github Application's private key"
        required: true

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.compute.outputs.should_release }}
      version: ${{ steps.compute.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - id: compute
        shell: bash
        env:
          NEWSFRAGMENTS_REQUIRED: ${{ inputs.newsfragments-required }}
          NEWSFRAGMENTS_DIR: ${{ inputs.newsfragments-dir }}
          NEWSFRAGMENTS_EXTENSION: ${{ inputs.newsfragments-extension }}
          MINOR_FRAGMENTS: ${{ inputs.minor-fragments }}
          MAJOR_FRAGMENTS: ${{ inputs.major-fragments }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          dir=${NEWSFRAGMENTS_DIR%/}
          ext=${NEWSFRAGMENTS_EXTENSION#.}
          required=$NEWSFRAGMENTS_REQUIRED

          skip() {
            echo "$1"
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          }

          # A towncrier fragment is named <name>.<type>.<ext>, so it always has at
          # least two dots. Matching on that keeps files like README.rst out of the
          # fragment count. Globs never match dotfiles, so .gitignore/.gitkeep are
          # excluded too.
          fragment_types() {
            local spec=$1 type
            local -a wanted matches
            IFS=',' read -ra wanted <<<"$spec"
            for type in "${wanted[@]}"; do
              type=${type//[[:space:]]/}
              [ -n "$type" ] || continue
              matches=("$dir"/*."$type"."$ext")
              if [ "${#matches[@]}" -gt 0 ]; then
                echo "Matched ${#matches[@]} '$type' fragment(s): ${matches[*]}" >&2
                return 0
              fi
            done
            return 1
          }

          if ! latest_tag=$(git describe --tags --abbrev=0 2>/dev/null); then
            echo "::warning::No tags found, so there is no version to bump from; skipping release."
            skip "Nothing to release."
          fi
          echo "Latest tag: $latest_tag"

          commit_count=$(git rev-list "${latest_tag}..HEAD" --count)
          echo "Commits since tag: $commit_count"
          if [ "$commit_count" -eq 0 ]; then
            skip "No commits since ${latest_tag}; nothing to release."
          fi

          # Tolerate prerelease/build metadata (v1.2.3-rc1, v1.2.3+build) by bumping
          # from the release core, but refuse anything we cannot parse rather than
          # feeding a non-numeric component into arithmetic.
          core=${latest_tag#v}
          core=${core%%-*}
          core=${core%%+*}
          if [[ ! $core =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::Cannot derive the next version from tag '${latest_tag}': expected [v]MAJOR.MINOR.PATCH."
            exit 1
          fi
          major=${BASH_REMATCH[1]}
          minor=${BASH_REMATCH[2]}
          patch=${BASH_REMATCH[3]}

          fragments=()
          if [ -d "$dir" ]; then
            fragments=("$dir"/*.*."$ext")
          elif [ "$required" = "true" ]; then
            echo "::error::newsfragments-required is set but newsfragments directory '${dir}' does not exist."
            exit 1
          else
            echo "No '${dir}' directory; continuing without newsfragments."
          fi
          echo "Newsfragments found: ${#fragments[@]}"

          if [ "$required" = "true" ] && [ "${#fragments[@]}" -eq 0 ]; then
            # An empty fragment directory is the normal state of a quiet repository
            # and must stay quiet. Fragments present under a different extension,
            # however, mean this repository would never release - so fail loudly.
            other=("$dir"/*.*.*)
            if [ "${#other[@]}" -gt 0 ]; then
              echo "::error::No '*.*.${ext}' newsfragments in '${dir}', but it holds ${#other[@]} other fragment-shaped file(s): ${other[*]}. Check the newsfragments-extension input."
              exit 1
            fi
            skip "newsfragments-required is set and '${dir}' holds no newsfragments; skipping release."
          fi

          if [ -n "${MAJOR_FRAGMENTS//[[:space:]]/}" ] && fragment_types "$MAJOR_FRAGMENTS"; then
            echo "Major-level fragments present; bumping major."
            major=$((major + 1))
            minor=0
            patch=0
          elif [ -n "${MINOR_FRAGMENTS//[[:space:]]/}" ] && fragment_types "$MINOR_FRAGMENTS"; then
            echo "Minor-level fragments present; bumping minor."
            minor=$((minor + 1))
            patch=0
          else
            echo "No major- or minor-level fragments; bumping patch."
            patch=$((patch + 1))
          fi

          next="${major}.${minor}.${patch}"
          echo "Next version: $next"
          echo "should_release=true" >> "$GITHUB_OUTPUT"
          echo "version=$next" >> "$GITHUB_OUTPUT"

  release:
    needs: plan
    if: needs.plan.outputs.should_release == 'true'
    uses: fizyk/actions-reuse/.github/workflows/shared-release.yml@v5.3.2
    with:
      version: ${{ needs.plan.outputs.version }}
      dependency-manager: ${{ inputs.dependency-manager }}
    secrets:
      app_id: ${{ secrets.app_id }}
      private_key: ${{ secrets.private_key }}
