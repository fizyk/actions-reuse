version: 2
updates:
- package-ecosystem: github-actions
  # "/" reaches .github/workflows and a root action.yml, never .github/actions - so the
  # composite actions have to be named. The group keeps one bump in one pull request
  # rather than one per directory it appears in.
  directories:
  - "/"
  - "/.github/actions/*"
  groups:
    github-actions:
      patterns:
      - "*"
  cooldown:
    default-days: 7
  schedule:
    interval: weekly
    time: "04:00"
  open-pull-requests-limit: 1
- package-ecosystem: pip
  directory: "/"
  cooldown:
    default-days: 7
  schedule:
    interval: weekly
    time: "04:10"
  open-pull-requests-limit: 1
