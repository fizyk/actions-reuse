name: 'Automerge'
description: 'Approve and arm auto-merge on non-major dependabot, renovate and pre-commit.ci pull requests'
inputs:
  github-token:
    description: 'Token approving and arming the pull requests; auto-merge merges with its credentials'
    required: true
  pull-requests:
    description: 'A pull request number, whitespace-separated numbers, or a JSON list of pull request objects as workflow_run and check_suite events carry them'
    required: true
  python-version:
    description: 'Python version the script runs on'
    default: '3.15'
runs:
  using: "composite"
  steps:
    - name: Set up uv
      uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      with:
        python-version: ${{ inputs.python-version }}
    - name: Arm auto-merge
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        GH_REPO: ${{ github.repository }}
        PULL_REQUESTS: ${{ inputs.pull-requests }}
        PYTHON_VERSION: ${{ inputs.python-version }}
      # Standard library only, so there is no project to install. The package
      # sits next to this file, so the action's directory goes on the path. The
      # input reaches the shell through the environment, never interpolated.
      run: |
        PYTHONPATH="$GITHUB_ACTION_PATH" uv run --no-project \
          --python "$PYTHON_VERSION" \
          python -m automerge -- "$PULL_REQUESTS"
