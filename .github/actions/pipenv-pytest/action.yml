name: 'pytest under coverage run'
description: >-
  Run pytest under `coverage run` in an existing pipenv environment and export the
  coverage XML. Unlike `pytest --cov`, this measures code imported while pytest
  starts up - a pytest plugin under test.
inputs:
  pytest-opts:
    description: 'Options passed to pytest'
    default: ''
  data-file:
    description: 'Coverage data file for this run'
    default: '.coverage'
  output-file:
    description: 'XML output filename'
    default: 'coverage.xml'
  coverage-process-start:
    description: >-
      Coverage configuration that child processes read. Set it only for a suite
      that spawns any - xdist workers, subprocesses - and enable `parallel` and
      `patch = subprocess` in it; ACTIONS.rst says why. Empty means a single
      process, needing no configuration and nothing combined.
    default: ''
runs:
  using: "composite"
  steps:
    - id: coverage
      shell: bash
      env:
        CONFIG: ${{ inputs.coverage-process-start }}
        DATA_FILE: ${{ inputs.data-file }}
      run: |
        # Absolute, so a test that changes the working directory cannot make
        # child processes miss the config or write data where the combine step
        # will not look. `pwd -W` is the native form under Windows runners.
        abs() { case $1 in /* | [A-Za-z]:[\\/]*) echo "$1" ;; *) echo "$(pwd -W 2>/dev/null || pwd)/$1" ;; esac; }
        data=$(abs "$DATA_FILE")
        rcfile=""
        child_env="{}"
        if [ -n "$CONFIG" ]; then
          [ -f "$CONFIG" ] || { echo "::error::coverage-process-start: no such file '$CONFIG'"; exit 1; }
          config=$(abs "$CONFIG")
          rcfile="--rcfile=$config"
          child_env="{\"COVERAGE_PROCESS_START\": \"$config\", \"COVERAGE_FILE\": \"$data\"}"
        fi
        {
          echo "data-file=$data"
          echo "rcfile=$rcfile"
          echo "child-env=$child_env"
          echo "children=${CONFIG:+true}"
        } >> "$GITHUB_OUTPUT"
    - name: Run pytest under coverage
      uses: fizyk/actions-reuse/.github/actions/pipenv-run@v5.5.0
      with:
        command: python -m coverage run ${{ steps.coverage.outputs.rcfile }} --data-file=${{ steps.coverage.outputs.data-file }} -m pytest ${{ inputs.pytest-opts }}
        env: ${{ steps.coverage.outputs.child-env }}
    # A failing run's coverage is still worth reporting, hence !cancelled().
    - name: Combine and export coverage
      if: ${{ !cancelled() && steps.coverage.outputs.children == 'true' }}
      uses: fizyk/actions-reuse/.github/actions/coverage-combine-export@v5.5.0
      with:
        data-file: ${{ steps.coverage.outputs.data-file }}
        output-file: ${{ inputs.output-file }}
    - name: Export coverage
      if: ${{ !cancelled() && steps.coverage.outputs.children != 'true' }}
      uses: fizyk/actions-reuse/.github/actions/pipenv-run@v5.5.0
      with:
        command: python -m coverage xml --data-file=${{ steps.coverage.outputs.data-file }} -o ${{ inputs.output-file }}
