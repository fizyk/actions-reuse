name: 'Setup Pipenv environment'
description: 'Setup pipenv'
inputs:
  python-version:  # id of input
    description: 'Python version to use'
    required: true
  allow-prereleases:
    description: "Allow falling back to pre-release versions of Python when a matching GA version of Python is not available."
    required: true
  pipenv-install-options:
    description: "Pipenv install options"
    default: ""
  cache:
    description: "Cache python environment?"
    default: true
runs:
  using: "composite"
  steps:
    - id: preserve-envvars
      shell: bash
      run: echo "PKG_CONFIG_PATH=$PKG_CONFIG_PATH" >> "$GITHUB_OUTPUT"
    - name: Set up cached Python ${{ inputs.python-version }}
      if: ${{ inputs.cache == 'true' }}
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ inputs.python-version }}
        allow-prereleases: ${{ inputs.allow-prereleases }}
        cache: pipenv
        cache-dependency-path: 'Pipfile'
    - name: Set up Python ${{ inputs.python-version }}
      if: ${{ inputs.cache != 'true' }}
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ inputs.python-version }}
        allow-prereleases: ${{ inputs.allow-prereleases }}
    # The value written back is PKG_CONFIG_PATH as the runner itself set it
    # before setup-python ran, never anything a caller or a pull request can
    # influence.
    - shell: bash
      if: steps.preserve-envvars.outputs.PKG_CONFIG_PATH
      env:
        PRESERVED_PKG_CONFIG_PATH: ${{ steps.preserve-envvars.outputs.PKG_CONFIG_PATH }}
      run: echo "PKG_CONFIG_PATH=$PKG_CONFIG_PATH:$PRESERVED_PKG_CONFIG_PATH" >> "$GITHUB_ENV"  # zizmor: ignore[github-env]
    - name: Check file existence
      id: check_files
      uses: andstor/file-existence-action@558493d6c74bf472d87c84eab196434afc2fa029 # v3.1.0
      with:
        files: "Pipfile.lock"
    - name: Restore Pipfile.lock if not in git
      if: steps.check_files.outputs.files_exists == 'false'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      id: loadcache
      with:
        path: Pipfile.lock
        key: pipfile-lock-${{ runner.os }}-${{ inputs.python-version }}-${{ hashFiles('Pipfile') }}
    - name: Install pipenv
      shell: bash
      run: |
        python -m pip install --upgrade pip pipenv
        PY=$(python -c "import sys; print(sys.executable)")
        pipenv --python "$PY"
        pipenv run python --version
    # `pipenv-install-options` is a shell fragment written by the calling
    # workflow, so it is expanded into the script rather than passed through the
    # environment, where quoting inside it would no longer be honoured.
    - name: Install dependencies
      shell: bash
      run: pipenv install --dev ${{ inputs.pipenv-install-options }}  # zizmor: ignore[template-injection]
    - name: Cache Pipfile.lock if not in git
      if: steps.check_files.outputs.files_exists == 'false'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      id: cache
      with:
        path: Pipfile.lock
        key: pipfile-lock-${{ runner.os }}-${{ inputs.python-version }}-${{ hashFiles('Pipfile') }}
    - name: Archive Pipfile.lock if not kept in git
      if: steps.check_files.outputs.files_exists == 'false'
      continue-on-error: true
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: pipfile-lock-${{ runner.os }}-${{ inputs.python-version }}-${{ hashFiles('Pipfile') }}
        path: Pipfile.lock
        overwrite: true
