name: Coverage combine and export
description: Combine coverage files and export XML report

inputs:
  data-file:
    description: Coverage data file prefix (for example .coverage.serial)
    required: true
  output-file:
    description: XML output filename
    required: true

runs:
  using: composite
  steps:
    # No glob: `coverage combine` finds this run's `<data-file>.*` files itself.
    # A `<data-file>*` shell glob would also match `.coveragerc` and same-prefix
    # data files belonging to other runs.
    - name: Combine coverage data
      uses: fizyk/actions-reuse/.github/actions/uv-run@v5.5.0
      with:
        command: python -m coverage combine --data-file=${{ inputs.data-file }}
    - name: Export coverage XML
      uses: fizyk/actions-reuse/.github/actions/uv-run@v5.5.0
      with:
        command: python -m coverage xml --data-file=${{ inputs.data-file }} -o ${{ inputs.output-file }}
