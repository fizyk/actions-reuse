name: 'Render Mermaid diagrams'
description: 'Render every .mmd file in a directory to SVG with a lockfile-pinned mermaid-cli'
inputs:
  mmd-path:
    description: 'Location of the Mermaid Markdown files'
    default: "docs"
  svg-path:
    description: 'Location of the path to generate svg files to'
    default: "docs/images"
  puppeteer-config:
    description: 'Path to puppeteer config file'
    default: "docs/puppeteer-config.json"
runs:
  using: "composite"
  steps:
    # The renderer comes from the lockfile committed next to this action, so a
    # mermaid-cli release cannot change the committed SVGs of the repositories
    # calling it. `--prefix` puts node_modules beside that lockfile rather than
    # in the checkout being rendered, which belongs to the caller.
    - name: Install Mermaid CLI
      shell: bash
      run: npm ci --prefix "$GITHUB_ACTION_PATH"
    - name: Render Diagrams
      shell: bash
      env:
        MMD_PATH: ${{ inputs.mmd-path }}
        SVG_PATH: ${{ inputs.svg-path }}
        PUPPETEER_CONFIG: ${{ inputs.puppeteer-config }}
      run: |
        mkdir -p "${SVG_PATH}"
        shopt -s nullglob
        files=("${MMD_PATH}"/*.mmd)
        if [ ${#files[@]} -eq 0 ]; then
          echo "No .mmd files found in ${MMD_PATH}; skipping."
          exit 0
        fi
        for file in "${files[@]}"; do
          base="$(basename "${file}" .mmd)"
          "$GITHUB_ACTION_PATH/node_modules/.bin/mmdc" \
            -p "${PUPPETEER_CONFIG}" \
            -i "${file}" \
            -o "${SVG_PATH}/${base}.svg" \
            -t neutral
        done
