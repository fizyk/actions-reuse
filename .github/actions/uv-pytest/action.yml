name: 'pytest under coverage run'
description: >-
  Run pytest under `coverage run` in an existing uv environment, then combine
  and export the coverage XML. Measures code imported at pytest startup - most
  notably a pytest plugin under test - which pytest-cov's own `--cov` cannot
  reach, because it starts measuring after entry point plugins are imported.
inputs:
  pytest-opts:
    description: 'Options passed to pytest'
    required: false
    default: ''
  data-file:
    description: 'Coverage data file for this run (for example .coverage.serial)'
    required: false
    default: '.coverage'
  output-file:
    description: 'XML output filename'
    required: false
    default: 'coverage.xml'
  coverage-process-start:
    description: >-
      Coverage configuration file subprocesses and xdist workers read
      (.coveragerc, setup.cfg, tox.ini or pyproject.toml). It has to enable
      `parallel`, otherwise workers overwrite each other's data, and to set
      `patch = subprocess` (`patch = ["subprocess"]` in pyproject.toml), without
      which nothing measures child processes on coverage older than 7.13.
    required: false
    default: '.coveragerc'
  env:
    description: >-
      JSON object string of additional environment variables to set. It may not
      contain COVERAGE_FILE or COVERAGE_PROCESS_START - those come from the
      data-file and coverage-process-start inputs, and the step fails if they
      appear here.
    required: false
    default: '{}'
runs:
  using: "composite"
  steps:
    # COVERAGE_PROCESS_START starts coverage in xdist workers and subprocesses
    # while `coverage run` owns the parent. Coverage honours it through
    # a1_coverage.pth only from 7.13, and pytest-cov 7 dropped its own .pth, so
    # below that `patch = subprocess` is all that is left - hence the contract
    # on coverage-process-start asks for both.
    # Kept in a step output rather than GITHUB_ENV, so it does not leak into the
    # calling job's other steps.
    - id: coverage-env
      shell: bash
      env:
        CALLER_ENV: ${{ inputs.env }}
        COVERAGE_PROCESS_START: ${{ inputs.coverage-process-start }}
        COVERAGE_FILE: ${{ inputs.data-file }}
      run: |
        caller_env="${CALLER_ENV:-}"
        reserved=$(jq -nr --argjson caller "${caller_env:-null}" '($caller // {})
          | keys_unsorted
          | map(select(. == "COVERAGE_FILE" or . == "COVERAGE_PROCESS_START"))
          | join(", ")')
        if [ -n "$reserved" ]; then
          echo "::error::env must not set $reserved - set the data-file and coverage-process-start inputs instead. Pointing COVERAGE_FILE somewhere else leaves the child processes writing data the combine step never sees."
          exit 1
        fi
        merged=$(jq -nc --argjson caller "${caller_env:-null}" '($caller // {}) + {
          COVERAGE_PROCESS_START: env.COVERAGE_PROCESS_START,
          COVERAGE_FILE: env.COVERAGE_FILE
        }')
        echo "merged=$merged" >> "$GITHUB_OUTPUT"
    - name: Run pytest under coverage
      uses: fizyk/actions-reuse/.github/actions/uv-run@v5.5.0
      with:
        command: python -m coverage run --data-file=${{ inputs.data-file }} -m pytest ${{ inputs.pytest-opts }}
        env: ${{ steps.coverage-env.outputs.merged }}
    # A failing run's coverage is still worth reporting.
    - name: Combine and export coverage
      if: ${{ !cancelled() }}
      uses: fizyk/actions-reuse/.github/actions/coverage-combine-export-uv@v5.5.0
      with:
        data-file: ${{ inputs.data-file }}
        output-file: ${{ inputs.output-file }}
